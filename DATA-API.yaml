schema_version: "1.0"
solution: mama-ryadom
base_url: "https://mama-ryadom-production.up.railway.app"
configuration_note: "value_from: подстановка значения с сохранением типа, см. docs/API-CHECK.md. Формальную схему оценки согласует организатор."
runner: "npm run api:check -- --local; опубликованный API: npm run api:check -- https://mama-ryadom-production.up.railway.app с MAX_INIT_DATA"
authentication:
  role: user
  method: "POST /api/auth с initData из MAX; использовать полученный token как Bearer"
  local_demo: "DEMO_MODE=true: POST /api/auth с телом {demo: true}; каждый вход создаёт отдельный тестовый профиль"
checks:
  - name: health
    method: GET
    path: /api/health
    role: public
    parameters: {}
    expected_status_codes: [200]
    response:
      content_type: application/json
      required: [status, version]
      values: {status: ok}
  - name: authentication
    method: POST
    path: /api/auth
    role: user
    parameters:
      body: {initData: {value_from: env.MAX_INIT_DATA}}
    expected_status_codes: [200]
    response:
      content_type: application/json
      required: [token, expiresIn]
  - name: state
    method: GET
    path: /api/state
    role: user
    parameters:
      headers: {Authorization: {value_from: auth.token, prefix: "Bearer "}}
    expected_status_codes: [200]
    response:
      content_type: application/json
      required: [profile, benefits, version, settings, tracking, reminders]
  - name: profile
    method: PUT
    path: /api/profile
    role: user
    parameters:
      headers: {Authorization: {value_from: auth.token, prefix: "Bearer "}}
      body:
        version: {value_from: state.version, type: integer}
        consent: true
        profile:
          stage: pregnant
          pregnancyWeeks: 30plus
          firstChild: "yes"
          children: "1"
          employment: employed
          income: low
          citizenship: "yes"
          registration: permanent
          received: []
    expected_status_codes: [200]
    response:
      content_type: application/json
      required: [profile, benefits, next, version]
  - name: tracker
    method: PUT
    path: /api/tracking/b01
    role: user
    parameters:
      headers: {Authorization: {value_from: auth.token, prefix: "Bearer "}}
      body: {status: planned, version: {value_from: state.version, type: integer}}
    expected_status_codes: [200]
    response:
      content_type: application/json
      required: [tracking, version]
  - name: settings
    method: PUT
    path: /api/profile
    role: user
    parameters:
      headers: {Authorization: {value_from: auth.token, prefix: "Bearer "}}
      body:
        version: {value_from: state.version, type: integer}
        settings: {unfinished: true}
    expected_status_codes: [200]
    response:
      content_type: application/json
      required: [settings, version]
  - name: reminder
    method: POST
    path: /api/reminders
    role: user
    parameters:
      headers: {Authorization: {value_from: auth.token, prefix: "Bearer "}}
      body:
        version: {value_from: state.version, type: integer}
        benefitId: b01
        kind: unfinished
        dueAt: {value_from: future.dueAt, type: string}
    expected_status_codes: [200]
    response:
      content_type: application/json
      required: [reminders, version]
  - name: questionnaire-start
    method: PUT
    path: /api/questionnaire
    role: user
    parameters:
      headers: {Authorization: {value_from: auth.token, prefix: "Bearer "}}
      body: {action: start, consent: true, version: {value_from: state.version, type: integer}}
    expected_status_codes: [200]
    response:
      content_type: application/json
      required: [draft, questionnaire, questionIndex, flow, version]
      values: {questionnaire: true, questionIndex: 0}
  - name: questionnaire-answer
    method: PUT
    path: /api/questionnaire
    role: user
    parameters:
      headers: {Authorization: {value_from: auth.token, prefix: "Bearer "}}
      body: {action: answer, questionId: stage, flow: {value_from: state.flow, type: string}, value: pregnant, version: {value_from: state.version, type: integer}}
    expected_status_codes: [200]
    response:
      content_type: application/json
      required: [draft, questionnaire, questionIndex, flow, version]
      values: {questionnaire: true, questionIndex: 1}
